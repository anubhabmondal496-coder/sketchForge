# Nginx Reverse Proxy Configuration for SketchForge Backend
# Place in /etc/nginx/sites-available/sketchforge and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _; # Replace with droplet IP or domain name

    client_max_body_size 50M;

    # Gzip compression for JSON and geometry
    gzip on;
    gzip_types application/json model/gltf-binary application/octet-stream;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keepalive and timeouts for long-running AI inference
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
