services:
  # 1. SketchForge Backend Web Service on Render
  - type: web
    name: sketchforge-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: standard
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: MOCK_MODE
        value: "true"
      - key: DEVICE
        value: cpu
      - key: HF_TOKEN
        sync: false
      - key: FRONTEND_URL
        value: https://sketchforge-ui.onrender.com

  # 2. SketchForge Frontend Static Site on Render
  - type: web
    name: sketchforge-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: sketchforge-backend
          type: web
          property: host
